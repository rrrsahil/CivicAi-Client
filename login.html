<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Login | CivicAI</title>

    <!-- Existing Global CSS -->
    <link rel="stylesheet" href="./css/global.css" />

    <!-- Auth Page CSS -->
    <link rel="stylesheet" href="./css/auth.css" />

    <!-- Icons -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
  </head>

  <body>
    <main class="auth-page auth-login">
      <!-- LEFT SIDE -->
      <section class="auth-visual">
        <div class="auth-visual-content">
          <span class="auth-eyebrow"> CIVICAI PLATFORM </span>

          <h1>Welcome Back!</h1>

          <p class="auth-subtitle">Login to your account to continue</p>

          <p class="auth-description">
            Access your dashboard, track complaints and stay updated with the
            latest updates.
          </p>
        </div>

        <div class="auth-city">
          <div class="auth-cloud cloud-one"></div>
          <div class="auth-cloud cloud-two"></div>

          <img src="assets/img.jpg" alt="CivicAI city illustration" />
        </div>
      </section>

      <!-- RIGHT SIDE -->
      <section class="auth-form-side">
        <div class="auth-card">
          <div class="auth-card-header">
            <h2>Login to Your Account</h2>
          </div>

          <form class="auth-form">
            <!-- Email -->
            <div class="form-group">
              <label for="login-email"> Email Address / Mobile Number </label>

              <div class="input-wrapper">
                <i class="fa-regular fa-user"></i>

                <input
                  type="text"
                  id="login-email"
                  placeholder="Enter email or mobile number"
                  autocomplete="username"
                />
              </div>
            </div>

            <!-- Password -->
            <div class="form-group">
              <label for="login-password"> Password </label>

              <div class="input-wrapper">
                <i class="fa-solid fa-lock"></i>

                <input
                  type="password"
                  id="login-password"
                  placeholder="Enter your password"
                  autocomplete="current-password"
                />

                <span class="password-icon">
                  <i class="fa-regular fa-eye-slash"></i>
                </span>
              </div>
            </div>

            <!-- Remember -->
            <div class="form-options">
              <label class="remember-option">
                <input type="checkbox" name="remember" />

                <span> Remember me </span>
              </label>

              <a href="./forgot-password.html"> Forgot Password? </a>
            </div>

            <!-- Login -->
            <button type="submit" class="auth-submit">Login</button>

            <!-- Divider -->
            <div class="auth-divider">
              <span></span>

              <small> or continue with </small>

              <span></span>
            </div>

            <!-- Social -->
            <div class="social-login">
              <button type="button">
                <i class="fa-brands fa-google"></i>
                Google
              </button>

              <button type="button">
                <i class="fa-brands fa-facebook"></i>
                Facebook
              </button>
            </div>

            <!-- Register -->
            <p class="auth-bottom-text">
              Don't have an account?

              <a href="register.html"> Register Now </a>
            </p>
          </form>
        </div>
      </section>
    </main>
  </body>
</html>
